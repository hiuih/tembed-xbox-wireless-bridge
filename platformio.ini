[env:tembed]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
; native USB (TinyUSB) is required for the HID gamepads; flashing uses the 1200 bps touch
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; The default post-upload reset (DTR/RTS) leaves this board in the ROM bootloader.
; Flash with no reset, then tools/upload_hook.py resets it with a watchdog reset.
board_upload.after_reset = no_reset
extra_scripts = post:tools/upload_hook.py
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wl,-zmuldefs
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit NeoPixel@^1.12.0
