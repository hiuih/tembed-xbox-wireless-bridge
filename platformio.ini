[env:tembed]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
; native USB (TinyUSB) is required for the HID gamepads; flashing uses the 1200 bps touch
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; The default post-upload reset (DTR/RTS) leaves this board in the ROM bootloader.
; Flash with no reset, then tools/upload_hook.py resets it with a watchdog reset.
board_upload.after_reset = no_reset
extra_scripts = post:tools/upload_hook.py
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wl,-zmuldefs
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit NeoPixel@^1.12.0

; A bare ESP32-S3 board (no screen / ring / knob): pairing window opens automatically at power-up,
; BOOT button (GPIO0) hold 1 s = pair, one optional RGB LED (GPIO48; -DLED_PIN=38 on v1.1 boards).
; Use the board's native "USB" port (not the UART/COM one) for the gamepad.
[env:s3_headless]
extends = env:tembed
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wl,-zmuldefs
    -DHEADLESS=1
build_src_filter = +<*> -<ui.cpp> -<ui_gfx.cpp> -<ui_screens.cpp> -<ui_screens2.cpp> -<ui_screens3.cpp> -<ble.cpp> -<updater.cpp> -<ui_screens4.cpp> -<nrf24.cpp> -<encoder.cpp> -<power.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; Bare ESP32-S3 as an Xbox 360 (XInput) controller for Windows: games see a real Xbox pad (Xbox glyphs/mapping).
; XInput must be the only USB function, so the console/log is the board's UART port, and flashing goes through
; the UART port too (DTR/RTS auto-reset).  Plug BOTH USB-C ports in: UART = flash/log, native "USB" = the PC.
[env:s3_xinput]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wl,-zmuldefs
    -DHEADLESS=1
    -DXINPUT_MODE=1
    -DRADIO_DEBUG=1
build_src_filter = +<*> -<ui.cpp> -<ui_gfx.cpp> -<ui_screens.cpp> -<ui_screens2.cpp> -<ui_screens3.cpp> -<ble.cpp> -<updater.cpp> -<ui_screens4.cpp> -<nrf24.cpp> -<encoder.cpp> -<power.cpp> -<hid.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; T-Embed CC1101 (Plus) as a Windows Xbox (XInput) bridge, with the screen UI, LED ring and knob.
; Built as an app-only image for the Launcher firmware (install firmware.bin from the SD card in Launcher).
; XInput must be the only USB function, so there is no USB serial; logs go to UART0 (GPIO43/44), unused here.
; Wide screen: -DUI_W=320 (a healthy display; the older damaged unit used the default 176).
[env:tembed_xinput]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wl,-zmuldefs
    -DXINPUT_MODE=1
    -DUI_W=320
    -DBLE_ENABLED=1
build_src_filter = +<*> -<hid.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit NeoPixel@^1.12.0
    h2zero/NimBLE-Arduino@^1.4.2
